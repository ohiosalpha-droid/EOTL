<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EOTL – KI-Assistent</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%2300ff88'/><text x='50' y='66' font-size='46' text-anchor='middle' font-family='monospace' font-weight='bold' fill='%23000'>E</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <aside id="sidebar">
    <div class="brand">
      <div class="logo">E</div>
      <span>EOTL</span>
    </div>
    <button id="new-chat" class="btn-primary">+ Neuer Chat</button>
    <div class="section-title">Verlauf</div>
    <ul id="chat-list"></ul>
    <div id="status" class="status"></div>
  </aside>

  <main>
    <header>
      <button id="toggle-sidebar" aria-label="Menü">☰</button>
      <div class="modes" role="tablist">
        <button class="mode active" data-mode="chat">💬 Chat</button>
        <button class="mode" data-mode="code">⌨️ Coder</button>
        <button class="mode" data-mode="bild">🎨 Bild</button>
      </div>
    </header>

    <section id="messages">
      <div id="welcome" class="welcome">
        <div class="logo big">E</div>
        <h1>Hallo, ich bin <span class="accent">EOTL</span></h1>
        <p>Ich kann mit dir chatten, programmieren und Bilder erstellen.</p>
        <div class="suggestions">
          <button data-mode="chat" data-text="Erklär mir in einfachen Worten, wie künstliche Intelligenz funktioniert.">Wie funktioniert KI?</button>
          <button data-mode="code" data-text="Schreib mir ein Python-Skript, das alle Dateien in einem Ordner nach Datum sortiert.">Python-Skript schreiben</button>
          <button data-mode="bild" data-text="Ein futuristischer Roboter in einer neongrünen Cyberpunk-Stadt bei Nacht">Bild erstellen</button>
          <button data-mode="chat" data-text="Gib mir 5 kreative Ideen für ein Wochenende.">Ideen fürs Wochenende</button>
        </div>
      </div>
    </section>

    <form id="composer">
      <div id="attachments"></div>
      <div class="input-row">
        <label class="attach" title="Bild anhängen">
          📎<input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
        </label>
        <textarea id="input" rows="1" placeholder="Nachricht an EOTL …"></textarea>
        <button type="submit" id="send" class="btn-primary" aria-label="Senden">➤</button>
      </div>
      <div class="hint">EOTL kann Fehler machen. Wichtige Informationen bitte prüfen.</div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
