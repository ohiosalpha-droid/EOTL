<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anmelden – EOTL</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><g stroke='%2334e89a' stroke-width='2.6' stroke-linecap='round'><path d='M12 2.5v19M2.5 12h19M5.3 5.3l13.4 13.4M18.7 5.3 5.3 18.7'/></g></svg>" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="login-page">
  <div class="login-glow"></div>
  <main class="login-card">
    <svg class="spark big" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"><path d="M12 2.5v19M2.5 12h19M5.3 5.3l13.4 13.4M18.7 5.3 5.3 18.7" /></g></svg>
    <h1>Willkommen bei EOTL</h1>
    <p class="muted">Melde dich an, um zu chatten, zu programmieren und Bilder zu erstellen.</p>
    <div class="error-text" id="login-error" hidden></div>
    <form class="login-form" method="post" action="/login">
      <input name="name" type="text" placeholder="Dein Name" autocomplete="name" maxlength="40" required autofocus />
      <input name="code" type="password" placeholder="Zugangscode" autocomplete="current-password" required />
      <button type="submit" class="provider-btn">Anmelden</button>
    </form>
    <p class="muted small login-foot">Den Zugangscode bekommst du vom Betreiber von EOTL.</p>
  </main>

  <script>
    const fehler = new URLSearchParams(location.search).get("fehler");
    if (fehler) {
      const err = document.getElementById("login-error");
      err.textContent = fehler;
      err.hidden = false;
    }
  </script>
</body>
</html>
