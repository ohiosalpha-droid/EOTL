<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anmelden – EOTL</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><g stroke='%2334e89a' stroke-width='2.6' stroke-linecap='round'><path d='M12 2.5v19M2.5 12h19M5.3 5.3l13.4 13.4M18.7 5.3 5.3 18.7'/></g></svg>" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="login-page">
  <div class="login-glow"></div>
  <main class="login-card">
    <svg class="spark big" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"><path d="M12 2.5v19M2.5 12h19M5.3 5.3l13.4 13.4M18.7 5.3 5.3 18.7" /></g></svg>
    <h1>Willkommen bei EOTL</h1>
    <p class="muted">Melde dich an, um zu chatten, zu programmieren und Bilder zu erstellen.</p>
    <div class="error-text" id="login-error" hidden></div>
    <div id="providers"></div>
    <p class="muted small login-foot">Mit der Anmeldung werden nur Name, E-Mail und Profilbild übernommen.</p>
  </main>

  <script>
    const LOGOS = {
      google: '<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8Z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1A12 12 0 0 0 12 24Z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6h-4a12 12 0 0 0 0 10.8l4-3.1Z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.3 6.6l4 3.1c.9-2.9 3.6-4.9 6.7-4.9Z"/></svg>',
      github: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.7.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .4.2.7.8.6A11.5 11.5 0 0 0 12 .5Z"/></svg>',
      microsoft: '<svg viewBox="0 0 24 24"><path fill="#F25022" d="M2 2h9.5v9.5H2z"/><path fill="#7FBA00" d="M12.5 2H22v9.5h-9.5z"/><path fill="#00A4EF" d="M2 12.5h9.5V22H2z"/><path fill="#FFB900" d="M12.5 12.5H22V22h-9.5z"/></svg>',
      demo: '<svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></g></svg>',
    };
    const params = new URLSearchParams(location.search);
    if (params.get("fehler")) {
      const err = document.getElementById("login-error");
      err.textContent = params.get("fehler");
      err.hidden = false;
    }
    fetch("/api/auth/anbieter").then((r) => r.json()).then(({ anbieter, demo }) => {
      const el = document.getElementById("providers");
      const entries = Object.entries(anbieter);
      if (demo) entries.push(["demo", "Demo-Zugang"]);
      if (!entries.length) {
        el.innerHTML = '<div class="empty-state">Noch kein Anmeldeanbieter eingerichtet.<br>Trage GOOGLE_CLIENT_ID und GOOGLE_CLIENT_SECRET in die Datei .env ein.</div>';
        return;
      }
      entries.forEach(([id, label], i) => {
        const a = document.createElement("a");
        a.className = "provider-btn";
        a.href = `/auth/${id}`;
        a.style.animationDelay = `${150 + i * 70}ms`;
        a.innerHTML = `${LOGOS[id] || ""}<span>${id === "demo" ? label : "Weiter mit " + label}</span>`;
        el.appendChild(a);
      });
    });
  </script>
</body>
</html>
